name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out Telos
        uses: actions/checkout@v7
        with:
          path: telos
          fetch-depth: 0

      - name: Resolve sibling refs from the Telos manifest
        # CI used to check the sibling flagships out at main while the manifest
        # declares their released surfaces, so it tested a combination Telos does
        # not claim to support. That is what the `|| true` on
        # hyphal-context-benchmark was absorbing: crucible main carries
        # crucible.recheck_template, added after v1.2.0, and the manifest declares
        # the v1.2.0 surface. Pinning each sibling to the version the manifest
        # expects makes the check mean something instead of being tolerated.
        id: siblings
        working-directory: telos
        run: |
          jq -r '.servers | to_entries[] | select(.key != "telos") | "\(.key)=v\(.value.freshness.expected_version)"' demo/integrations/mcp-server-manifest.json | tee -a "$GITHUB_OUTPUT"

      - name: Check out Gather
        uses: actions/checkout@v7
        with:
          repository: HarperZ9/gather
          ref: ${{ steps.siblings.outputs.gather }}
          path: gather

      - name: Check out Crucible
        uses: actions/checkout@v7
        with:
          repository: HarperZ9/crucible
          ref: ${{ steps.siblings.outputs.crucible }}
          path: crucible

      - name: Check out Index
        uses: actions/checkout@v7
        with:
          repository: HarperZ9/index
          ref: ${{ steps.siblings.outputs.index }}
          path: index

      - name: Check out Forum
        uses: actions/checkout@v7
        with:
          repository: HarperZ9/forum
          ref: ${{ steps.siblings.outputs.forum }}
          path: forum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run every Telos test
        # npm test globs demo/**/*.test.mjs. This step used to name the files by
        # hand, and 21 of the 65 test files on disk were never listed, so a third
        # of the suite did not run here and a new test file stayed invisible until
        # someone remembered to add it. All 21 pass.
        #
        # The hand list also carried `node demo/hyphal-context-benchmark.test.mjs
        # || true  # stale-commit dependency, pre-existing`. That test passes now,
        # so the tolerance was swallowing nothing and would have swallowed the next
        # real regression in it.
        working-directory: telos
        run: npm test
      - name: Run MCP launch gate
        working-directory: telos
        run: npm run test:mcp

      - name: Release packaging controls
        # RELEASING.md lists this as a required gate and neither workflow ran
        # it. The gate's own pattern already names
        # `python tools/test_release_artifacts.py` alongside the node contract
        # commands, so it was written to run in both test jobs and be compared
        # between them. It validates the archive layout and that release.yml
        # runs the same contract commands as ci.yml.
        working-directory: telos
        run: python tools/test_release_artifacts.py
      - name: Run Telos room and workflow smoke
        working-directory: telos
        run: |
          node demo/catalog.mjs --summary
          node demo/server-manifest.mjs --summary
          node demo/room.mjs --json
          node demo/flagship-workflow.mjs
