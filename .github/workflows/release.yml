name: Release

# Builds release artifacts (npm pack tarball + runnable demo zip) and attaches
# them to a GitHub release. Never runs on push: only on manual dispatch with an
# existing tag, or when the operator publishes a release. Tagging, releasing,
# and any npm publish stay operator-gated.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to (e.g. v0.2.0)"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out Telos
        uses: actions/checkout@v7
        with:
          path: telos
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Resolve sibling refs from the Telos manifest
        # CI used to check the sibling flagships out at main while the manifest
        # declares their released surfaces, so it tested a combination Telos does
        # not claim to support. That is what the `|| true` on
        # hyphal-context-benchmark was absorbing: crucible main carries
        # crucible.recheck_template, added after v1.2.0, and the manifest declares
        # the v1.2.0 surface. Pinning each sibling to the version the manifest
        # expects makes the check mean something instead of being tolerated.
        id: siblings
        working-directory: telos
        run: |
          jq -r '.servers | to_entries[] | select(.key != "telos") | "\(.key)=v\(.value.freshness.expected_version)"' demo/integrations/mcp-server-manifest.json | tee -a "$GITHUB_OUTPUT"

      - name: Check out Gather
        uses: actions/checkout@v7
        with:
          repository: HarperZ9/gather
          ref: ${{ steps.siblings.outputs.gather }}
          path: gather

      - name: Check out Crucible
        uses: actions/checkout@v7
        with:
          repository: HarperZ9/crucible
          ref: ${{ steps.siblings.outputs.crucible }}
          path: crucible

      - name: Check out Index
        uses: actions/checkout@v7
        with:
          repository: HarperZ9/index
          ref: ${{ steps.siblings.outputs.index }}
          path: index

      - name: Check out Forum
        uses: actions/checkout@v7
        with:
          repository: HarperZ9/forum
          ref: ${{ steps.siblings.outputs.forum }}
          path: forum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run every Telos test
        # npm test globs demo/**/*.test.mjs. This step used to name the files by
        # hand, and 21 of the 65 test files on disk were never listed, so a third
        # of the suite did not run here and a new test file stayed invisible until
        # someone remembered to add it. All 21 pass.
        #
        # The hand list also carried `node demo/hyphal-context-benchmark.test.mjs
        # || true  # stale-commit dependency, pre-existing`. That test passes now,
        # so the tolerance was swallowing nothing and would have swallowed the next
        # real regression in it.
        working-directory: telos
        run: npm test
      - name: Run MCP launch gate
        working-directory: telos
        run: npm run test:mcp

      - name: Release packaging controls
        # RELEASING.md lists this as a required gate and neither workflow ran
        # it. The gate's own pattern already names
        # `python tools/test_release_artifacts.py` alongside the node contract
        # commands, so it was written to run in both test jobs and be compared
        # between them. It validates the archive layout and that release.yml
        # runs the same contract commands as ci.yml.
        working-directory: telos
        run: python tools/test_release_artifacts.py
      - name: Run Telos room and workflow smoke
        working-directory: telos
        run: |
          node demo/catalog.mjs --summary
          node demo/server-manifest.mjs --summary
          node demo/room.mjs --json
          node demo/flagship-workflow.mjs

  release:
    name: build and attach artifacts
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build reviewed npm package and matching runnable zip
        run: |
          mkdir .release
          npm pack --ignore-scripts --pack-destination .release
          python tools/release_artifacts.py --tarball .release/project-telos-mcp-*.tgz --tag "$RELEASE_TAG" --output-dir .release
          (cd .release && sha256sum --check SHA256SUMS.txt)

      # A re-run for a tag that already has its assets, for example after the
      # publish credentials are fixed, rebuilds the same bytes: both 0.4.0
      # builds matched digest for digest. So an attached set is accepted only
      # when it holds exactly the files just built and every one of them
      # verifies against the new SHA256SUMS.txt. Anything else is refused.
      # Nothing attached is ever overwritten.
      - name: Attach new artifacts to the GitHub release
        run: |
          ATTACHED="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          BUILT="$(ls .release | sort)"
          if [ -z "$ATTACHED" ]; then
            gh release upload "$RELEASE_TAG" .release/*.tgz .release/*.zip .release/SHA256SUMS.txt
            exit 0
          fi
          if [ "$ATTACHED" != "$BUILT" ]; then
            echo "release $RELEASE_TAG carries a different asset set; refusing to add to it"
            echo "attached: $ATTACHED"
            echo "built: $BUILT"
            exit 1
          fi
          mkdir .attached
          gh release download "$RELEASE_TAG" --dir .attached
          (cd .attached && sha256sum --check ../.release/SHA256SUMS.txt)
          cmp .attached/SHA256SUMS.txt .release/SHA256SUMS.txt
          echo "release $RELEASE_TAG already carries these exact bytes; nothing attached"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: .release/*

  publish:
    name: publish to npm
    needs: release
    # Stays skipped until the repository variable NPM_PUBLISH_ENABLED is 'true',
    # so a tag can be cut and every gate below can run with no upload behind it.
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write        # provenance, and OIDC trusted publishing once configured
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # The tag being released, resolved the same way the release job resolves
      # it. GITHUB_REF_NAME is the tag only on a release event; on a manual
      # dispatch it is the branch the workflow was dispatched from.
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      # Check out the tag, not the dispatch ref. Without this the job packs and
      # publishes whatever main happens to hold, which is not necessarily the
      # bytes the tag names.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: The tag must match the declared version
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "no release tag resolved; refusing to publish"; exit 1
          fi
          TAG="${RELEASE_TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json $PKG"; exit 1
          fi
          echo "version gate: tag $TAG == package.json $PKG"

      # --provenance signs a statement naming the repository this workflow ran
      # in, and the registry refuses the upload with E422 unless package.json
      # names the same one. 0.4.0 declared no repository at all. Checked here so
      # the refusal arrives before anything is signed.
      - name: The declared repository must be the one provenance names
        run: |
          DECLARED="$(node -p "String(require('./package.json').repository?.url ?? '')" | sed -e 's/^git+//' -e 's/\.git$//')"
          EXPECTED="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [ "$DECLARED" != "$EXPECTED" ]; then
            echo "package.json repository.url is '$DECLARED'; provenance will name '$EXPECTED'"; exit 1
          fi
          echo "repository gate: $DECLARED"

      # Two routes to the registry. With the NPM_TOKEN secret set, the token has
      # to authenticate; `npm whoami` fails fast on a revoked or mistyped one.
      # It cannot see whether the token may create a new package, which is a
      # separate grant: a granular token limited to named packages authenticates
      # here and still gets E404 on the upload of a first version. With no
      # secret, npm uses OIDC trusted publishing, which needs npm 11.5.1 or newer.
      - name: The publish credentials must be usable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NPM_VERSION="$(npm --version)"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$NPM_VERSION" \
              || { echo "no NPM_TOKEN, and npm $NPM_VERSION is older than 11.5.1, which trusted publishing needs"; exit 1; }
            echo "credentials: OIDC trusted publishing, npm $NPM_VERSION"
            exit 0
          fi
          # An assignment, not a substitution inside echo: under `bash -e` the
          # assignment fails with whoami, while echo would print an empty name
          # and exit 0. The 0.4.1 run did exactly that on an E401 token and
          # went on to sign provenance for an upload that could not succeed.
          WHO="$(npm whoami)"
          echo "credentials: token authenticates as $WHO, npm $NPM_VERSION"

      - name: Build the tarball and record its digest
        run: |
          npm pack --ignore-scripts
          sha256sum ./*.tgz

      # Installs the packed tarball the way a user would and drives the real
      # stdio server through the bin a user runs. A package can pack cleanly,
      # install cleanly, and still fail at launch because a file the server
      # imports was left out of the `files` allowlist, or because npx has no bin
      # it can select, which is how 0.4.0 shipped. The --npx pass runs the
      # README's command through npm's own bin selection.
      - name: The published bytes must serve MCP from a clean install
        run: |
          TARBALL="$GITHUB_WORKSPACE/$(ls *.tgz)"
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TARBALL"
          node "$GITHUB_WORKSPACE/tools/probe-installed-mcp.mjs" "$WORK" --npx "$TARBALL"

      - name: Publish
        # Publishes the tarball the steps above digested and probed, not a
        # fresh pack of the checkout, so the bytes on the registry are the
        # bytes that passed. --provenance records which workflow built them.
        # NODE_AUTH_TOKEN is only needed for a first publish: npm cannot
        # configure trusted publishing for a name that does not exist yet. Once
        # the package exists and a trusted publisher is configured on
        # npmjs.com, the secret can be removed and this step runs on OIDC.
        run: npm publish "$GITHUB_WORKSPACE/$(ls *.tgz)" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
