name: Release

# Builds release artifacts (npm pack tarball + runnable demo zip) and attaches
# them to a GitHub release. Never runs on push: only on manual dispatch with an
# existing tag, or when the operator publishes a release. Tagging, releasing,
# and any npm publish stay operator-gated.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to (e.g. v0.2.0)"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out Telos
        uses: actions/checkout@v7
        with:
          path: telos
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Resolve sibling refs from the Telos manifest
        # CI used to check the sibling flagships out at main while the manifest
        # declares their released surfaces, so it tested a combination Telos does
        # not claim to support. That is what the `|| true` on
        # hyphal-context-benchmark was absorbing: crucible main carries
        # crucible.recheck_template, added after v1.2.0, and the manifest declares
        # the v1.2.0 surface. Pinning each sibling to the version the manifest
        # expects makes the check mean something instead of being tolerated.
        id: siblings
        working-directory: telos
        run: |
          jq -r '.servers | to_entries[] | select(.key != "telos") | "\(.key)=v\(.value.freshness.expected_version)"' demo/integrations/mcp-server-manifest.json | tee -a "$GITHUB_OUTPUT"

      - name: Check out Gather
        uses: actions/checkout@v7
        with:
          repository: HarperZ9/gather
          ref: ${{ steps.siblings.outputs.gather }}
          path: gather

      - name: Check out Crucible
        uses: actions/checkout@v7
        with:
          repository: HarperZ9/crucible
          ref: ${{ steps.siblings.outputs.crucible }}
          path: crucible

      - name: Check out Index
        uses: actions/checkout@v7
        with:
          repository: HarperZ9/index
          ref: ${{ steps.siblings.outputs.index }}
          path: index

      - name: Check out Forum
        uses: actions/checkout@v7
        with:
          repository: HarperZ9/forum
          ref: ${{ steps.siblings.outputs.forum }}
          path: forum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run every Telos test
        # npm test globs demo/**/*.test.mjs. This step used to name the files by
        # hand, and 21 of the 65 test files on disk were never listed, so a third
        # of the suite did not run here and a new test file stayed invisible until
        # someone remembered to add it. All 21 pass.
        #
        # The hand list also carried `node demo/hyphal-context-benchmark.test.mjs
        # || true  # stale-commit dependency, pre-existing`. That test passes now,
        # so the tolerance was swallowing nothing and would have swallowed the next
        # real regression in it.
        working-directory: telos
        run: npm test
      - name: Run MCP launch gate
        working-directory: telos
        run: npm run test:mcp

      - name: Run Telos room and workflow smoke
        working-directory: telos
        run: |
          node demo/catalog.mjs --summary
          node demo/server-manifest.mjs --summary
          node demo/room.mjs --json
          node demo/flagship-workflow.mjs

  release:
    name: build and attach artifacts
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build reviewed npm package and matching runnable zip
        run: |
          mkdir .release
          npm pack --ignore-scripts --pack-destination .release
          python tools/release_artifacts.py --tarball .release/project-telos-mcp-*.tgz --tag "$RELEASE_TAG" --output-dir .release
          (cd .release && sha256sum --check SHA256SUMS.txt)

      - name: Attach new artifacts to the GitHub release
        run: gh release upload "$RELEASE_TAG" .release/*.tgz .release/*.zip .release/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: .release/*

  publish:
    name: publish to npm
    needs: release
    # Stays skipped until the repository variable NPM_PUBLISH_ENABLED is 'true',
    # so a tag can be cut and every gate below can run with no upload behind it.
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write        # provenance, and OIDC trusted publishing once configured
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: The tag must match the declared version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ -n "$TAG" ] && [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json $PKG"; exit 1
          fi
          echo "version gate: tag $TAG == package.json $PKG"

      - name: Build the tarball and record its digest
        run: |
          npm pack --ignore-scripts
          for f in ./*.tgz; do echo "sha256  $(sha256sum "$f")"; done

      # Installs the packed tarball the way a user would and drives the real
      # stdio server. A package can pack cleanly, install cleanly, and still fail
      # at launch because a file the server imports was left out of the `files`
      # allowlist. That is the defect this gate exists to catch, and nothing
      # earlier in this workflow would see it.
      - name: The published bytes must serve MCP from a clean install
        run: |
          TARBALL="$(ls ./*.tgz)"
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$TARBALL"
          node - <<'PROBE'
          const { spawnSync } = require("node:child_process");
          const req = (id, method, params = {}) =>
            JSON.stringify({ jsonrpc: "2.0", id, method, params });
          const input = [
            req(1, "initialize", {
              protocolVersion: "2024-11-05",
              capabilities: {},
              clientInfo: { name: "release-gate", version: "1" }
            }),
            req(2, "tools/list")
          ].join("\n") + "\n";
          const run = spawnSync("npx", ["--no-install", "telos-mcp"], {
            input, encoding: "utf8", timeout: 180000, shell: true
          });
          const lines = run.stdout.split("\n").filter((l) => l.trim().startsWith("{"));
          if (!lines.length) {
            console.error("no JSON on stdout. status=", run.status);
            console.error(run.stderr.slice(0, 2000));
            process.exit(1);
          }
          let info = null, tools = null;
          for (const line of lines) {
            const result = JSON.parse(line).result ?? {};
            if (result.serverInfo) info = result.serverInfo;
            if (result.tools) tools = result.tools;
          }
          if (!info) throw new Error("initialize returned no serverInfo");
          if (!tools || !tools.length) throw new Error("tools/list returned nothing");
          const declared = require("./node_modules/project-telos-mcp/package.json").version;
          if (info.version !== declared) {
            throw new Error(`serverInfo ${info.version} but package.json ${declared}`);
          }
          console.log(`installed MCP ok: ${info.name} ${info.version}, ${tools.length} tools`);
          PROBE

      - name: Publish
        # --provenance records which workflow built these bytes, verifiable from
        # the registry. NODE_AUTH_TOKEN is only needed for a first publish: npm
        # cannot configure trusted publishing for a name that does not exist yet,
        # so OIDC alone returns E404 on version one. Once the package exists and a
        # trusted publisher is configured on npmjs.com, the secret can be removed
        # and this step keeps working on OIDC.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
